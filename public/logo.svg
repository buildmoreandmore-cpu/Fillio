<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BankReadyDocs">
  <title>BankReadyDocs</title>
  <!-- Navy institutional background -->
  <rect width="64" height="64" rx="14" fill="#0B2820"/>

  <!-- Bank facade pediment -->
  <path d="M12 22 L32 11 L52 22 L52 25 L12 25 Z" fill="#FFFFFF"/>

  <!-- Three Greek-revival columns -->
  <rect x="16" y="27" width="5" height="18" rx="1" fill="#FFFFFF"/>
  <rect x="29.5" y="27" width="5" height="18" rx="1" fill="#FFFFFF"/>
  <rect x="43" y="27" width="5" height="18" rx="1" fill="#FFFFFF"/>

  <!-- Base / floor -->
  <rect x="12" y="47" width="40" height="4" rx="1" fill="#FFFFFF"/>

  <!-- Emerald approval seal -->
  <circle cx="49" cy="49" r="11" fill="#5DDBA8" stroke="#0B2820" stroke-width="2.5"/>
  <path d="M44 49.5 L47.8 53.3 L54.5 46.6" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
